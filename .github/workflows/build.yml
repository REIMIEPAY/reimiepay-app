name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Build APK
        run: |
          flutter create. --project-name reimiepay --org com.reimiepay.app --platforms=android
          flutter pub add google_mobile_ads
          sed -i '/<application/a \ <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7817232546318110~1436395195"\/>' android/app/src/main/AndroidManifest.xml
          cat > lib/main.dart << 'ENDDART'
          import 'package:flutter/material.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';
          void main(){WidgetsFlutterBinding.ensureInitialized(); MobileAds.instance.initialize(); runApp(const MaterialApp(debugShowCheckedModeBanner:false, home:LoginPage()));}
          class LoginPage extends StatefulWidget{const LoginPage({super.key}); @override State<LoginPage> createState()=>_LoginPageState();}
          class _LoginPageState extends State<LoginPage>{BannerAd? b; bool l=false; @override void initState(){super.initState(); b=BannerAd(adUnitId:'ca-app-pub-7817232546318110/3023230023', size:AdSize.banner, request:const AdRequest(), listener:BannerAdListener(onAdLoaded:(_)=>setState(()=>l=true), onAdFailedToLoad:(a,e)=>a.dispose()))..load();} @override Widget build(BuildContext c){return Scaffold(backgroundColor:const Color(0xFF4A148C), bottomNavigationBar:l?Container(color:Colors.white,height:b!.size.height.toDouble(),child:AdWidget(ad:b!)):null, body:SafeArea(child:Padding(padding:const EdgeInsets.all(24), child:Column(children:[const Text('NIGERIA ONLY - ReimiePay'), Container(padding:const EdgeInsets.all(20), decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(20)), child:Column(children:[const TextField(decoration:InputDecoration(labelText:'Email')), const TextField(obscureText:true,decoration:InputDecoration(labelText:'Password')), const SizedBox(height:20), ElevatedButton(onPressed:()=>Navigator.pushReplacement(c,MaterialPageRoute(builder:(_)=>const HomePage())), child:const Text('LOGIN')), TextButton(onPressed:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>const RegisterPage())), child:const Text('Register'))]))]))));} }
          class RegisterPage extends StatelessWidget{const RegisterPage({super.key}); @override Widget build(BuildContext c){return Scaffold(backgroundColor:const Color(0xFF4A148C), appBar:AppBar(backgroundColor:Colors.transparent,leading:IconButton(icon:const Icon(Icons.arrow_back,color:Colors.white), onPressed:()=>Navigator.pop(c))), body:Padding(padding:const EdgeInsets.all(24), child:Container(padding:const EdgeInsets.all(20), decoration:BoxDecoration(color:Colors.white,borderRadius:BorderRadius.circular(20)), child:Column(children:[const TextField(decoration:InputDecoration(labelText:'Full Name')), const TextField(decoration:InputDecoration(labelText:'Phone +234')), const TextField(decoration:InputDecoration(labelText:'Email')), const TextField(obscureText:true,decoration:InputDecoration(labelText:'Password')), const SizedBox(height:20), ElevatedButton(onPressed:()=>Navigator.pushReplacement(c,MaterialPageRoute(builder:(_)=>const HomePage())), child:const Text('REGISTER - NIGERIA'))]))));} }
          class HomePage extends StatelessWidget{const HomePage({super.key}); @override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:const Text('ReimiePay NG')), body:const Center(child:Text('Welcome!')));} }
          ENDDART
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: reimiepay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
